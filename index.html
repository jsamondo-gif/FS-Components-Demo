<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metalstorm Uplink: Project Holocron</title>

    <!-- Tactical HUD Font -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script id="fsc-api" src="https://cdn.onfastspring.com/checkout-sdk/latest/fastspring-sdk.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            /* Custom Tactical Fighter Crosshair Cursor (Encoded SVG) */
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><circle cx='16' cy='16' r='7' fill='none' stroke='%2300e5ff' stroke-width='1.5'/><circle cx='16' cy='16' r='1.5' fill='%23ff9900'/><line x1='16' y1='2' x2='16' y2='8' stroke='%2300e5ff' stroke-width='1.5'/><line x1='16' y1='24' x2='16' y2='30' stroke='%2300e5ff' stroke-width='1.5'/><line x1='2' y1='16' x2='8' y2='16' stroke='%2300e5ff' stroke-width='1.5'/><line x1='24' y1='16' x2='30' y2='16' stroke='%2300e5ff' stroke-width='1.5'/></svg>") 16 16, crosshair;

            /* Pure CSS Atmospheric Space / HUD Background */
            background-color: #02050e;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 153, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(10, 20, 45, 0.9) 0%, rgba(2, 5, 14, 1) 100%),
                linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            background-attachment: fixed;
            color: #b0c4de; 
            font-family: 'Share Tech Mono', monospace; 
            margin: 0; 
            padding: 70px 20px 30px 20px; 
            min-height: 100vh;
            display: flex; 
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            perspective: 1200px;
        }

        /* Top Bar Header Navigation */
        .hud-topbar {
            position: fixed;
            top: 0; left: 0; width: 100%;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(2, 6, 15, 0.95) 0%, rgba(2, 6, 15, 0) 100%);
            border-bottom: 1px solid rgba(0, 229, 255, 0.25);
            font-size: 12px;
            letter-spacing: 2px;
            z-index: 10;
            pointer-events: none;
        }
        .hud-logo { color: #00e5ff; font-weight: bold; text-shadow: 0 0 8px rgba(0,229,255,0.6); }
        .hud-logo span { color: #ff9900; }
        .hud-telemetry { color: #87cefa; font-size: 11px; }

        /* HUD Corner Telemetry Ticks */
        .hud-corner {
            position: fixed;
            font-size: 11px;
            color: rgba(0, 229, 255, 0.5);
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 5;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.4);
        }
        .top-left { top: 55px; left: 30px; }
        .top-right { top: 55px; right: 30px; }
        .bottom-left { bottom: 20px; left: 30px; }
        .bottom-right { bottom: 20px; right: 30px; }

        /* Sonar Radar Ping Overlay */
        body::before, body::after {
            content: '';
            position: fixed;
            top: 50%; left: 50%;
            width: 700px; height: 700px;
            margin-top: -350px; margin-left: -350px;
            border: 2px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3), inset 0 0 15px rgba(0, 229, 255, 0.2);
            border-radius: 50%;
            pointer-events: none;
            animation: radarSweep 4s cubic-bezier(0.1, 0.7, 0.1, 1) infinite;
            z-index: 0;
        }

        body::after {
            animation-delay: 2s;
        }

        @keyframes radarSweep {
            0% { transform: scale(0.1); opacity: 0.9; }
            50% { opacity: 0.6; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        /* RED ENEMY BOGEY RADAR BLIPS */
        .radar-blip {
            position: fixed;
            width: 7px;
            height: 7px;
            background-color: #ff3344;
            border-radius: 50%;
            box-shadow: 0 0 12px #ff3344, 0 0 24px #ff0022;
            pointer-events: none;
            z-index: 0;
            animation: blipPulse 4s ease-in-out infinite;
        }

        .radar-blip::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px;
            width: 13px; height: 13px;
            border: 1px solid rgba(255, 51, 68, 0.7);
            pointer-events: none;
        }

        @keyframes blipPulse {
            0%, 100% { opacity: 0.15; transform: scale(0.7); }
            45%, 55% { opacity: 1; transform: scale(1.3); }
        }

        .main-wrapper { 
            display: flex; 
            gap: 30px; 
            width: 100%; 
            max-width: 1050px; 
            align-items: flex-start; 
            z-index: 1;
        }
        
        /* Left Panel - Pilot Roster */
        .left-panel { 
            flex: 1; 
            background-color: rgba(5, 12, 30, 0.9); 
            border: 1px solid #00e5ff; 
            padding: 22px 25px; 
            border-radius: 4px; 
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.25); 
            backdrop-filter: blur(8px);
            position: relative;
            transition: box-shadow 0.3s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .left-panel::before, .left-panel::after {
            content: ''; position: absolute; width: 18px; height: 18px; border: 2px solid #00e5ff;
            pointer-events: none;
        }
        .left-panel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .left-panel::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
        
        /* Right Panel - Secure Uplink */
        .right-panel { 
            flex: 1; 
            background: linear-gradient(135deg, rgba(3, 8, 20, 0.94), rgba(12, 24, 48, 0.94));
            border: 1px solid #ff9900;
            border-radius: 4px; 
            padding: 18px 20px; 
            box-shadow: 0 0 30px rgba(255, 153, 0, 0.3); 
            backdrop-filter: blur(8px);
            position: relative;
            transition: box-shadow 0.3s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-height: 520px;
            overflow-y: auto;
        }

        /* Custom Tactical HUD Scrollbar for Right Panel */
        .right-panel::-webkit-scrollbar {
            width: 5px;
        }
        .right-panel::-webkit-scrollbar-track {
            background: rgba(2, 6, 15, 0.8);
            border-left: 1px solid rgba(255, 153, 0, 0.2);
        }
        .right-panel::-webkit-scrollbar-thumb {
            background: #ff9900;
            border-radius: 2px;
            box-shadow: 0 0 8px #ff9900;
        }
        
        h2 { 
            color: #00e5ff;
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-top: 0; 
            margin-bottom: 6px;
            font-size: 21px;
        }
        
        .instructions { color: #87cefa; font-size: 13px; line-height: 1.3; margin-bottom: 14px; }
        
        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; margin-bottom: 4px; font-weight: bold; color: #ff9900; font-size: 12px; letter-spacing: 1px;}
        
        input { 
            width: 100%; padding: 8px 10px; border: 1px solid #00e5ff; background-color: rgba(0, 0, 0, 0.6); 
            color: #ffffff; 
            border-radius: 2px; font-size: 13px; font-family: 'Share Tech Mono', monospace;
            transition: all 0.3s ease;
            cursor: text;
        }
        
        input:focus { 
            outline: none; 
            border-color: #ffffff; 
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.8), inset 0 0 6px rgba(0, 229, 255, 0.3); 
            animation: reticlePulse 1.5s infinite alternate;
        }

        @keyframes reticlePulse {
            0% { border-color: #00e5ff; box-shadow: 0 0 8px rgba(0, 229, 255, 0.6); }
            100% { border-color: #ffffff; box-shadow: 0 0 16px rgba(0, 229, 255, 1); }
        }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #02060f inset !important;
            -webkit-text-fill-color: #00e5ff !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        
        .artifact-box {
            border: 1px solid #00e5ff;
            background-color: rgba(0, 229, 255, 0.05);
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 2px;
            color: #ffffff;
            border-left: 4px solid #00e5ff;
            display: flex;
            align-items: center
